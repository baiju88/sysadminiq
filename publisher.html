<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SysAdminIQ Publisher</title>

<style>
body{
    font-family:Arial, sans-serif;
    max-width:900px;
    margin:40px auto;
    padding:20px;
}

input, textarea, select{
    width:100%;
    padding:10px;
    margin-bottom:10px;
}

button{
    background:#f38020;
    color:white;
    border:none;
    padding:12px 20px;
    cursor:pointer;
}

#result{
    margin-top:20px;
    padding:10px;
    border:1px solid #ddd;
}
</style>

</head>
<body>

<h2>SysAdminIQ Article Publisher</h2>

<input id="title" placeholder="Article Title">

<select id="platform">
    <option>Cisco UCS</option>
    <option>VMware</option>
    <option>Windows</option>
    <option>Linux</option>
    <option>AWS</option>
    <option>Azure</option>
</select>

<input id="category" placeholder="Category">

<textarea id="content"
rows="10"
placeholder="Article Content"></textarea>

<button onclick="publishArticle()">
Publish Article
</button>

<div id="result"></div>

<script>

async function publishArticle(){

    const article = {

        title:
        document.getElementById('title').value,

        platform:
        document.getElementById('platform').value,

        category:
        document.getElementById('category').value,

        content:
        document.getElementById('content').value,

        author_email:
        "baijucm@gmail.com"
    };

    const response = await fetch(
        "https://sysadminiq-api.baijucm.workers.dev",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify(article)
        }
    );

    const result = await response.json();

    document.getElementById('result').innerHTML =
        JSON.stringify(result,null,2);
}

</script>

</body>
</html>
