<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SysAdminIQ Publisher</title>

<style>

body{
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
}

h2{
    color:#f38020;
}

input,
textarea,
select{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    box-sizing:border-box;
}

button{
    background:#f38020;
    color:white;
    border:none;
    padding:12px 20px;
    cursor:pointer;
    margin-right:10px;
}

button:hover{
    background:#d56c14;
}

.section{
    margin-bottom:20px;
}

#selectedFiles{
    background:#f8f8f8;
    border:1px solid #ddd;
    padding:10px;
    margin-top:10px;
}

.file-item{
    padding:5px;
    border-bottom:1px solid #eee;
}

#result{
    margin-top:20px;
    padding:10px;
    border:1px solid #ddd;
    white-space:pre-wrap;
}

small{
    color:#666;
}

</style>

</head>

<body>

<h2>SysAdminIQ Article Publisher</h2>

<div class="section">

    <input
        id="title"
        placeholder="Article Title">

    <select id="platform">
        <option>Cisco UCS</option>
        <option>VMware</option>
        <option>Windows</option>
        <option>Linux</option>
        <option>AWS</option>
        <option>Azure</option>
    </select>

    <input
        id="category"
        placeholder="Category">

    <textarea
        id="content"
        rows="10"
        placeholder="Article Content"></textarea>

</div>

<div class="section">

    <h3>Supporting Attachments</h3>

    <input
        id="articleAttachments"
        type="file"
        multiple
        accept=".png,.jpg,.jpeg,.pdf,.docx,.xlsx,.pptx,.txt,.log,.vsdx">

    <small>
        Supported Files:
        PNG, JPG, JPEG, PDF,
        DOCX, XLSX, PPTX,
        TXT, LOG, VSDX
    </small>

    <div id="selectedFiles">
        No files selected.
    </div>

</div>

<button onclick="publishArticle()">
    Publish Article
</button>

<button onclick="uploadTest()">
    Upload Test File
</button>

<div id="result"></div>

<script>

let selectedFiles = [];
let uploadedAttachments = [];

document
    .getElementById("articleAttachments")
    .addEventListener("change", function(e){

        selectedFiles = Array.from(e.target.files);

        if(selectedFiles.length === 0){

            document.getElementById(
                "selectedFiles"
            ).innerHTML =
                "No files selected.";

            return;
        }

        document.getElementById(
            "selectedFiles"
        ).innerHTML =
            selectedFiles
                .map(file => `
                    <div class="file-item">
                        📎 ${file.name}
                        (${Math.round(file.size / 1024)} KB)
                    </div>
                `)
                .join('');
    });

async function publishArticle(){

    const article = {

        title:
            document.getElementById('title').value,

        platform:
            document.getElementById('platform').value,

        category:
            document.getElementById('category').value,

        content:
            document.getElementById('content').value,

        author_email:
            "baijucm@gmail.com",

       attachments:
    uploadedAttachments
    };

    try{

        const response =
            await fetch(
                "https://sysadminiq-api.baijucm.workers.dev",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify(article)
                }
            );

        const result =
            await response.json();
        uploadedAttachments.push({

    name: file.name,

    type: file.type,

    size: file.size,

    key: result.key

});

        document.getElementById(
            "result"
        ).innerHTML =
            JSON.stringify(
                result,
                null,
                2
            );

    }
    catch(error){

        document.getElementById(
            "result"
        ).innerHTML =
            "Error: " +
            error.message;
    }
}

async function uploadTest(){

    const file =
        document
        .getElementById("articleAttachments")
        .files[0];

    if(!file){

        alert("Please select a file");

        return;
    }

    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );

    try {

        const response =
            await fetch(
                "https://sysadminiq-api.baijucm.workers.dev/upload-test",
                {
                    method: "POST",
                    body: formData
                }
            );

        const result =
            await response.json();

        alert(
            JSON.stringify(
                result,
                null,
                2
            )
        );

    }
    catch(error){

        alert(
            "Upload failed: " +
            error.message
        );
    }
}

</script>

</body>
</html>
